<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold">Croquis esquemático – Pantalla infrarroja a gas (aula)</text>

  <!-- ELEVACION -->
  <text x="150" y="60" font-weight="bold">ELEVACIÓN (pared con pantalla)</text>
  <rect x="40" y="75" width="400" height="400" fill="#f4f4f4" stroke="#000" stroke-width="3"/>
  <!-- piso -->
  <line x1="20" y1="475" x2="460" y2="475" stroke="#000" stroke-width="4"/>
  <text x="445" y="495" text-anchor="end">Piso terminado (NPT)</text>
  <!-- pantalla -->
  <rect x="170" y="215" width="100" height="40" fill="#e9a23b" stroke="#000" stroke-width="2"/>
  <text x="220" y="240" text-anchor="middle">PANTALLA</text>
  <!-- eje -->
  <line x1="220" y1="85" x2="220" y2="470" stroke="#c00" stroke-dasharray="8 4"/>
  <text x="224" y="100" fill="#c00">eje</text>
  <!-- ventana -->
  <rect x="330" y="190" width="90" height="110" fill="#bfe3ff" stroke="#000" stroke-width="2"/>
  <text x="375" y="250" text-anchor="middle">Ventana</text>
  <!-- cota altura >=2.00 -->
  <line x1="120" y1="255" x2="120" y2="475" stroke="#06c"/>
  <line x1="112" y1="255" x2="128" y2="255" stroke="#06c"/>
  <line x1="112" y1="475" x2="128" y2="475" stroke="#06c"/>
  <text x="70" y="370" fill="#06c" font-weight="bold">≥ 2,00 m</text>
  <text x="62" y="386" fill="#06c" font-size="11">(base pantalla)</text>
  <!-- llave de paso -->
  <circle cx="300" cy="370" r="9" fill="#2a2" stroke="#000"/>
  <text x="315" y="374">Llave de paso</text>
  <line x1="470" y1="330" x2="470" y2="410" stroke="#06c"/>
  <text x="480" y="355" fill="#06c" font-weight="bold">1,50 a 1,80 m</text>
  <!-- retiro a ventana -->
  <line x1="270" y1="270" x2="330" y2="270" stroke="#c00"/>
  <text x="300" y="285" text-anchor="middle" fill="#c00" font-weight="bold">R = ?</text>
  <!-- retiro a muro -->
  <line x1="40" y1="235" x2="170" y2="235" stroke="#c00"/>
  <text x="105" y="228" text-anchor="middle" fill="#c00" font-weight="bold">R = ?</text>

  <!-- PLANTA -->
  <text x="640" y="60" font-weight="bold">PLANTA (esquema)</text>
  <rect x="560" y="75" width="300" height="260" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="710" y="205" text-anchor="middle" fill="#666">Local &gt; 30 m³</text>
  <rect x="650" y="75" width="120" height="14" fill="#e9a23b" stroke="#000"/>
  <text x="710" y="68" text-anchor="middle" font-size="11">Pantalla</text>
  <rect x="800" y="70" width="14" height="60" fill="#bfe3ff" stroke="#000"/>
  <text x="820" y="150" font-size="11">Ventana</text>
  <line x1="770" y1="82" x2="800" y2="82" stroke="#c00"/>
  <text x="785" y="112" text-anchor="middle" fill="#c00" font-size="11">R = ?</text>
  <rect x="560" y="290" width="300" height="12" fill="#9c9" stroke="#000"/>
  <text x="710" y="326" text-anchor="middle" font-size="11">Pared al exterior con rejillas de ventilación</text>

  <!-- NOTA -->
  <rect x="540" y="360" width="340" height="140" fill="#fff8e1" stroke="#c90"/>
  <text x="550" y="380" font-weight="bold">Importante</text>
  <text x="550" y="400">• R (retiro a muro/ventana): NO verificado.</text>
  <text x="550" y="418">  Lo fija el manual del fabricante del modelo.</text>
  <text x="550" y="436">• Normalmente se mide desde el borde/chapa</text>
  <text x="550" y="454">  del artefacto, no desde el eje: confirmar</text>
  <text x="550" y="472">  en manual del modelo antes de ejecutar.</text>
  <text x="550" y="490">• Salida de gases &gt; 0,50 m de aberturas.</text>
</svg>
